name: Backend CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Phase 02 readiness
        id: ready
        shell: bash
        run: |
          if [[ -f backend/requirements.txt ]]; then
            test -f backend/requirements-dev.txt
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Phase 01: Ruff, Pytest, dependency validation and audit pending application initialization." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.enabled == 'true'
        with:
          python-version: '3.12'
      - name: Install verified dependencies
        if: steps.ready.outputs.enabled == 'true'
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint, test, validate and audit dependencies
        if: steps.ready.outputs.enabled == 'true'
        run: |
          python -m ruff check backend/
          python -m ruff format --check backend/
          python -m pytest -q backend/tests
          python -m pip check
          python -m pip_audit -r backend/requirements.txt -r backend/requirements-dev.txt
