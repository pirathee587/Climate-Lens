server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;

    # Local two-port setup: API traffic goes directly to the browser-visible API.
    # Never return the SPA shell for an accidentally relative API request.
    location /api/ { return 404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
