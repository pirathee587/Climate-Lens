name: Backend CI
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'backend/**', '.github/workflows/backend-ci.yml', '.github/workflows/docker-build.yml']
  pull_request:
    paths: ['scripts/**', 'backend/**', '.github/workflows/backend-ci.yml', '.github/workflows/docker-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/requirements*.lock
      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check . ../scripts --config pyproject.toml
      - name: Ruff formatting
        run: python -m ruff format --check . ../scripts --config pyproject.toml
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Infrastructure smoke checker tests
        run: python -m unittest discover -s ../scripts/tests -v
      - name: Validate dependency compatibility
        run: python -m pip check
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements-dev.lock --no-deps --disable-pip
      - name: Build backend image without publishing
        run: docker build -f Dockerfile -t terratrend-api:ci .
      - name: Smoke check non-root offline production container
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges:true terratrend-api:ci)
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          test "$(docker exec "$container_id" id -u)" = 10001
          for attempt in {1..30}; do
            if docker exec "$container_id" python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"; then break; fi
            sleep 1
          done
          test -s scripts/smoke_backend.py
          smoke_code=$(cat scripts/smoke_backend.py)
          docker exec "$container_id" python -c "$smoke_code" --environment production
          docker exec "$container_id" python -c "import app.data.repository_adapter, app.statistics"
