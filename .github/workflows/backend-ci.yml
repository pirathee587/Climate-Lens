name: Backend CI
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml', '.github/workflows/docker-build.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml', '.github/workflows/docker-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/requirements*.lock
      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff formatting
        run: python -m ruff format --check .
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Validate dependency compatibility
        run: python -m pip check
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements-dev.lock --no-deps --disable-pip
      - name: Build backend image without publishing
        run: docker build -f Dockerfile -t terratrend-api:ci .
      - name: Smoke check non-root container and health
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --detach terratrend-api:ci)
          trap 'docker logs "$container_id"; docker rm -f "$container_id"' EXIT
          test "$(docker exec "$container_id" id -u)" = 10001
          for attempt in {1..30}; do
            if docker exec "$container_id" python -c "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2); assert json.load(r)=={'status':'ok','service':'terratrend-api','api_version':'v1'}"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
