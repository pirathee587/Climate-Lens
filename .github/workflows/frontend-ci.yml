name: Frontend CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readiness:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.source.outputs.available }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Report actual application availability
        id: source
        shell: bash
        run: |
          if [[ -f frontend/package.json || -f frontend/package-lock.json || -f frontend/index.html ]]; then
            test -f frontend/package.json
            test -f frontend/package-lock.json
            test -f frontend/index.html
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'BLOCKED: frontend scaffold absent. Frontend lint, typecheck, tests, build and audit are NOT TESTED. Merge the reviewed owner scaffold before integration.' >> "$GITHUB_STEP_SUMMARY"
          fi
  frontend:
    needs: readiness
    if: needs.readiness.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      - run: npm audit --audit-level=high
