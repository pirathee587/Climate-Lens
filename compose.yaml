# Frontend runtime requires Shinthurie's real scaffold; backend can run separately.
name: terratrend
services:
  backend:
    build:
      context: ./backend
      target: production
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      APP_PORT: "8000"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS-http://localhost:5173}
      SNAPSHOT_ROOT: /data/demo
      SNAPSHOT_APPROVALS: ${SNAPSHOT_APPROVALS:-[]}
      SNAPSHOT_QUALITY_POLICIES: ${SNAPSHOT_QUALITY_POLICIES:-[]}
      RESULT_CACHE_TTL_SECONDS: ${RESULT_CACHE_TTL_SECONDS:-1200}
      RESULT_CACHE_MAX_ENTRIES: ${RESULT_CACHE_MAX_ENTRIES:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - type: bind
        source: ${SNAPSHOT_HOST_PATH:-./data/demo}
        target: /data/demo
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 6
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        # This URL is resolved by the browser, not the Compose network.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:8080"
    volumes:
      - type: bind
        source: ./infra/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 6
